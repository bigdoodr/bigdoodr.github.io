<ul class="social-icons">
  <li>
    <a href="{{ '/feed.xml' | relative_url }}" title="RSS Feed">
      <i class="fas fa-rss" aria-hidden="true"></i><span class="sr-only">RSS Feed</span>
    </a>
  </li>
  {%- if site.github_username %}
  <li>
    <a href="https://github.com/{{ site.github_username }}" rel="me noopener" target="_blank" title="GitHub">
      <i class="fab fa-github" aria-hidden="true"></i><span class="sr-only">GitHub</span>
    </a>
  </li>
  {%- endif %}
  {%- if site.linkedin_username %}
  <li>
    <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" rel="me noopener" target="_blank" title="LinkedIn">
      <i class="fab fa-linkedin" aria-hidden="true"></i><span class="sr-only">LinkedIn</span>
    </a>
  </li>
  {%- endif %}
  {%- if site.mastodon_username %}
  <li>
    <a href="{{ site.mastodon_username }}" rel="me noopener" target="_blank" title="Mastodon">
      <i class="fab fa-mastodon" aria-hidden="true"></i><span class="sr-only">Mastodon</span>
    </a>
  </li>
  {%- endif %}
</ul>
