<head>
  <!-- Site build date: {{ "now" | date: "%FT%T%z" }} -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  {%- include theme-init.html -%}

  <!-- Begin SEO -->
  {% seo %}
  <!-- End SEO -->

  <link rel="stylesheet" href="{{ '/css/theme.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/override.css' | relative_url }}">
  {%- for sheet in page.extra_css %}
  <link rel="stylesheet" href="{{ sheet | relative_url }}">
  {%- endfor %}

  {% feed_meta %}

  {% if jekyll.environment == 'production' and site.google_analytics -%}
  {% include google-analytics.html %}
  {%- endif %}

  <!-- highlight.js -->
  <link rel="stylesheet" href="{{ '/js/highlightjs/styles/github.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/js/highlightjs/styles/ssms.css' | relative_url }}">
  <script src="{{ '/js/highlightjs/highlight.min.js' | relative_url }}"></script>
  <script src="{{ '/js/highlightjs/languages/plaintext.min.js' | relative_url }}"></script>
  <script src="{{ '/js/highlightjs/languages/powershell.min.js' | relative_url }}"></script>
  <script src="{{ '/js/highlightjs/languages/tsql.min.js' | relative_url }}"></script>
  <script>hljs.highlightAll();</script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="{{ '/js/theme.js' | relative_url }}" defer></script>
</head>
