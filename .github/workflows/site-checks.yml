name: Site checks

# Builds the site the same way GitHub Pages does and checks it for broken links.
#   • Every push / pull request: internal links and anchors (fast; fails the run if broken)
#   • Every Monday + on demand: external links too; opens a GitHub issue
#     titled "Broken links report" when anything is dead.
#
# /sitemap/ and /slashes/ no longer need a workflow — they are generated by Liquid
# at build time (see sitemap.md and _includes/slash-pages.html).

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/Casey Scruggs - Resume.pdf"
  pull_request:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, ~8am Central
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
      PAGES_REPO_NWO: ${{ github.repository }}
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Check internal links
        run: |
          gem install html-proofer -v "~> 5.0" --no-document
          htmlproofer ./_site \
            --disable-external \
            --checks Links,Scripts \
            --no-enforce-https \
            --ignore-empty-mailto \
            --allow-missing-href \
            --swap-urls "^https\:\/\/bigdoodr\.github\.io:" \
            --ignore-files "/\/staging\//,/\/hull-breaker\/packs\//,/\/ActiveUpdateCycleWebPage\/assets\//,/\/BuildWithSwiftDialog\/assets\//,/\/WKUProDevDay2026\/assets\//"

      # ── External links: weekly / manual only (slow, and other sites flake) ──
      - name: Check external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 30
            --max-retries 2
            --accept 200..=299,403,429,999
            --exclude-path _site/staging
            --exclude-path _site/hull-breaker/packs
            --exclude "^https?://(www\.)?(linkedin|facebook|twitter|x|instagram)\.com"
            --exclude "^https?://fonts\.(googleapis|gstatic)\.com"
            --exclude "^https?://bigdoodr\.github\.io"
            --exclude "^mailto:"
            './_site/**/*.html'
          output: ./lychee-report.md
          fail: false

      - name: Open a "Broken links report" issue
        if: steps.lychee.outputs.exit_code != '' && steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links report
          content-filepath: ./lychee-report.md
          labels: broken-links
