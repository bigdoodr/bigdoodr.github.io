  /resources/obsidianTemplates/EquipmentTemplate.html: "Obsidian template: Equipment"
  /resources/obsidianTemplates/ExerciseTemplate.html: "Obsidian template: Exercise"
  /resources/obsidianTemplates/FocusTemplate.html: "Obsidian template: Focus"
  /resources/obsidianTemplates/RoutineTemplate.html: "Obsidian template: Routine"
