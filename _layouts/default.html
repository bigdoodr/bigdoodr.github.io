<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>

    <div class="no-print">
      {%- include header.html -%}
    </div>

    <main class="page-content" id="main-content" aria-label="Content">
      <div class="wrapper">
        {%- unless page.hide_search %}
        <form method="get" id="ddgSearch" class="no-print" action="https://duckduckgo.com/" role="search">
          <input type="hidden" name="sites" value="{{ site.url | remove: 'https://' }}">
          <input type="text" name="q" placeholder="Search this site…" aria-label="Search this site on DuckDuckGo">
          <button type="submit">Search</button>
        </form>
        {%- endunless %}
        {{ content }}
      </div>
    </main>

    <div class="no-print">
      {%- include footer.html -%}
    </div>

    <script>
    // Make the full list-item pill clickable when it contains exactly one link
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".page-content li").forEach(function (li) {
        var links = li.querySelectorAll("a");
        if (links.length === 1) {
          li.style.cursor = "pointer";
          li.addEventListener("click", function (e) {
            if (!e.target.closest("a")) links[0].click();
          });
        }
      });
    });
    </script>
  </body>
</html>
